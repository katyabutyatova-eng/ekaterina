<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галактическая Оборона</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>🚀 Галактическая Оборона</h1>
    <div class="hud">
      <span>Счёт: <b id="score">0</b></span>
      <span>Кристаллы: <b id="resources">0</b></span>
      <span>Волна: <b id="wave">1</b></span>
      <span>Жизни: <b id="lives">❤️❤️❤️</b></span>
    </div>
    <canvas id="game" width="800" height="600"></canvas>
    <div class="controls">
      <button id="upgrade-btn" onclick="upgradeShip()">Улучшить корабль (60 💎)</button>
      <button id="start-btn" onclick="restartGame()">Начать игру</button>
    </div>
    <p class="hint">WASD или стрелки — движение, пробел — огонь. Собирайте 💎 и улучшайте корабль!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
